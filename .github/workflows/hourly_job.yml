name: Hourly Chart Updater

on:
  schedule:
    # 說明：對應台灣時間週一至週五 07:10 至 16:10 每小時執行一次
    # UTC 時間 23:10 (前一天晚上) 以及 UTC 時間 00:10 - 08:10 (當天早上)
    - cron: '10 23,0-8 * * *'

  workflow_dispatch: # 保留手動點擊觸發測試按鈕

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許自動提交並更新檔案權限

    steps:
      - name: 1. 複製專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib requests pandas

      - name: 4. 執行繪圖腳本
        run: python main.py

      - name: 5. 自動將產出的 PNG 圖表 Commit 並 Push 回專案
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update generated charts [skip ci]"
          file_pattern: "*.png"   # 自動抓取資料夾內產出的所有 PNG 圖片
