name: Hourly Chart Updater

on:
  schedule:
    # 台灣時間週一至週五 09:00 - 18:00（對應 UTC 時間 01:00 - 10:00 每小時一次）
    - cron: '0 1-10 * * 1-5'
  workflow_dispatch: # 允許在網頁上記錄頁面手動點擊按鈕觸發測試

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 開放自動寫入/更新 chart.png 的權限

    steps:
      - name: 1. 複製專案程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝 Matplotlib 繪圖套件
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib requests pandas

      - name: 4. 執行繪圖腳本
        run: python main.py

      - name: 5. 自動將產出的 chart.png Commit 並 Push 回專案
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update generated chart [skip ci]"
          file_pattern: "chart.png"
