name: Hourly Chart Updater

on:
schedule:
    # 台灣時間 07:17 - 16:17 (對應 UTC 時間 23:17 及 00:17 - 08:17)
    # 星期設定為 0-5，確保涵蓋台灣週一早上的 UTC 週日晚上
    - cron: '17 23,0-8 * * 0-5'

  workflow_dispatch: # 保留手動點擊觸發測試按鈕

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許自動提交並更新檔案權限

    steps:
      - name: 1. 複製專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib requests pandas

      - name: 4. 執行繪圖腳本
        run: python main.py

      - name: 5. 自動將產出的 PNG 圖表 Commit 並 Push 回專案
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update generated charts [skip ci]"
          file_pattern: "*.png"   # 自動抓取資料夾內產出的所有 PNG 圖片
